[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-ngcomms-code"
version = "1.0.0"
description = "Reproducible experiments for asymmetric autoencoder source compression in communication systems."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "David Carrascal"},
  {name = "Javier Diaz-Fuentes"},
  {name = "Elisa Rojas"},
  {name = "Joaquín Álvarez-Horcajo"},
  {name = "José M. Arco"},
]
keywords = [
  "autoencoder",
  "asymmetric autoencoder",
  "data compression",
  "communications",
  "energy-aware design",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ae-ngcomms-run = "ae_ngcomms.cli:main"
ae-ngcomms-plot = "ae_ngcomms.plotting:main"

[project.urls]
Repository = "https://github.com/NETSERV-UAH/AE-ngComms-code"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

