name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,plot]"
      - name: Test
        run: python -m pytest
      - name: Validate published results
        run: python scripts/validate_published_results.py
      - name: Regenerate plots
        run: ae-ngcomms-plot --results-dir results/published --output-dir figures/reproduced
